<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SRI LANKA — THE JOURNEY OF A NATION</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Encodes path and query into hash and redirects to index.html
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #07090e; color: #cbd5e1; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #cfa935; font-family: serif;">SRI LANKA — THE JOURNEY OF A NATION</h2>
      <p style="font-size: 14px; color: #94a3b8;">Redirecting to digital museum archive...</p>
    </div>
  </body>
</html>
